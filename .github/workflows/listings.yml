name: Päivitä toimitilatiedot

on:
  schedule:
    - cron: '0 0 * * *' # Suoritetaan päivittäin klo 00:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Asenna Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Suorita skripti
        run: |
          npm install
          node fetch-listings.js
      - name: Commit ja push
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add public/listings.json
          git commit -m 'Päivitä toimitilatiedot'
          git push
